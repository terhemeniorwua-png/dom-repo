<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-[#000000e1] text-white pt-10">
    
    <div class="grid grid-cols-2 gap-10">

        <div class="flex flex-col gap-5 px-20">
            <h1 class="text-5xl font-black">My To-Do List</h1>
            <p class="listCount text-5xl font-black pl-40 pb-5">0</p>
            <ul class="space-y-10">
               
            </ul>
        </div>

        <div class="py-5">
            <form action="">

                <h1 class="text-5xl font-black pb-5">Add To List</h1>

                <label for="" class="text-lg">Enter an activity here:</label>
                <input type="text" name="input" class="border py-1 mx-5 px-5 rounded-lg" placeholder="Input a task..." id="searchBar">

                <input type="button" value="Add" id="button" class="border px-5 py-1 rounded">
            </form>
        </div>

    </div>

    <!-- COUNT INCREAMENT -->

    <section class="pl-20">
        <h1 class="count text-5xl font-black pl-40 pb-5">0</h1>
        <div class="flex items-center gap-5">
            <button id="increase" class="border py-2 px-5 font-bold">Increase</button>
            <button id="Decrease" class="border py-2 px-5 font-bold">Decrease</button>
            <button id="Reset" class="border py-2 px-5 font-bold">Reset</button>
        </div>
    </section>



    <script src="function.js"></script>
</body>
</html>
